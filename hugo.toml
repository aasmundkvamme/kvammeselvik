baseURL = "https://aasmundkvamme.github.io/kvammeselvik/"
locale = "nn"
title = "Kvamme/Selvik"
theme = "beautifulhugo"

[params]
  subtitle = "Livet i familien Kvamme/Selvik, kanskje mest Aasmund"
  dateFormat = "2006-01-02"
  wordCount = true
  readingTime = true
  enableGitInfo = true

#[frontmatter]
#  lastmod = [":git", "lastmod", "date"]

[Params.author]
  name = "Aasmund Kvamme"
  email = "aasmund.kvamme@proton.me"


[markup.highlight]
  noClasses = false

[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

